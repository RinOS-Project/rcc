name: rcc-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-toolchain:
    name: host-${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: public-base/toolchain/RinCompiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: public-base/toolchain/RinCompiler

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinOS-SDK
          path: public-base/RinOS-SDK

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinGPU
          path: public-base/libs/RinGPU

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinresource
          path: public-base/libs/rinresource

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinvalidate
          path: public-base/toolchain/rinvalidate

      - name: Verify selected host compiler
        run: test "$(make --no-print-directory print-host-cc)" = "$CC"

      - name: Build rcc, rcc++, rld and rar
        run: make -j2 all

      - name: Run compiler and format smoke tests
        run: |
          make test
          make test-c17
          make test-cxx
          make test-cxx-cli
          make test-cxx-language-linkage
          make test-cxx-member-specifiers
          make test-cxx-function-templates
          make test-cxx-qualified-namespaces
          make test-cxx-overloads
          make test-cxx-parser-recovery
          make test-tool-relative-includes
          make test-preprocessor-continuation
          make test-atomic-builtins
          make test-inline-asm-execute
          make test-static-assert
          make test-link
          make test-archive
          make test-archive-link
          make test-manifest
          make test-driver-policy
          make test-weak-link
          make test-object-width
          make test-special-sections
          make test-tls
          make test-direct-relocation

  regression-gate:
    name: aggregate-regression-${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: public-base/toolchain/RinCompiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: public-base/toolchain/RinCompiler

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinOS-SDK
          path: public-base/RinOS-SDK

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinGPU
          path: public-base/libs/RinGPU

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinresource
          path: public-base/libs/rinresource

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinvalidate
          path: public-base/toolchain/rinvalidate

      - name: Verify selected host compiler
        run: test "$(make --no-print-directory print-host-cc)" = "$CC"

      - name: Build complete host toolchain
        run: make -j2 all

      - name: Run complete production regression gate
        run: make test-ci

  sanitizer-gate:
    name: sanitizer-${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: public-base/toolchain/RinCompiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: public-base/toolchain/RinCompiler

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinOS-SDK
          path: public-base/RinOS-SDK

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/RinGPU
          path: public-base/libs/RinGPU

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinresource
          path: public-base/libs/rinresource

      - uses: actions/checkout@v4
        with:
          repository: RinOS-Project/rinvalidate
          path: public-base/toolchain/rinvalidate

      - name: Verify selected host compiler
        run: test "$(make --no-print-directory print-host-cc)" = "$CC"

      - name: Run ASan and UBSan regression suite
        run: make -j2 test-sanitize
